<!-- ==========================================
  DASHBOARD COMPONENT HTML
  Bố cục Dashboard chuẩn Accessibility & Responsive
========================================== -->
<div id="dashboard-view" class="dashboard-container">
    <!-- 1. WELCOME HERO SECTION -->
    <section class="welcome-hero" aria-label="Chào mừng người dùng">
        <div>
            <h1 class="welcome-title">Xin chào, Học viên! 👋</h1>
            <p class="welcome-desc">Chào mừng bạn quay trở lại. Hãy chọn một môn học hoặc bộ đề bất kỳ để bắt đầu luyện tập ngay hôm nay!</p>
        </div>
    </section>

    <!-- 2. QUICK ACTIONS BAR -->
    <section aria-label="Thao tác nhanh">
        <div class="quick-actions-bar">
            <button type="button" id="btn-quick-exam" class="action-card-btn">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span>Thi thử ngẫu nhiên</span>
            </button>
            <button type="button" id="btn-quick-practice" class="action-card-btn">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                <span>Luyện nhanh 10 câu</span>
            </button>
            <button type="button" id="btn-review-wrong" class="action-card-btn">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                <span>Ôn câu làm sai</span>
            </button>
        </div>
    </section>

    <!-- 3. STATISTICS CARDS -->
    <section aria-label="Thống kê tổng quan">
        <div class="stats-grid">
            <!-- Thống kê 1: Tổng bộ đề đã làm -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-total-exams" class="stat-value">0</span>
                    <span class="stat-label">Tổng số đề đã làm</span>
                </div>
            </div>

            <!-- Thống kê 2: Tổng số câu đã làm -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-total-questions" class="stat-value">0</span>
                    <span class="stat-label">Tổng số câu đã làm</span>
                </div>
            </div>

            <!-- Thống kê 3: Điểm trung bình -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-avg-score" class="stat-value">0.0</span>
                    <span class="stat-label">Điểm trung bình</span>
                </div>
            </div>

            <!-- Thống kê 4: Chuỗi ngày học (Streak) -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-streak-days" class="stat-value">0 ngày</span>
                    <span class="stat-label">Streak liên tục</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 4. SUBJECT CARDS SECTION -->
    <section aria-label="Danh sách môn học">
        <div class="section-title-wrapper">
            <h2 class="section-title">Danh Sách Môn Học</h2>
        </div>
        <div id="subjects-grid-container" class="subjects-grid">
            <!-- Will be dynamically populated via DOM API -->
        </div>
    </section>

    <!-- 5. RECENT EXAMS SECTION -->
    <section aria-label="Lịch sử thi gần đây">
        <div class="section-title-wrapper">
            <h2 class="section-title">Lịch Sử Làm Bài Gần Đây</h2>
        </div>
        <div class="recent-exams-card">
            <div id="recent-exams-container">
                <!-- Dynamic Content or Empty State -->
            </div>
        </div>
    </section>
</div>
