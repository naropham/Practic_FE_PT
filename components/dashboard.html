<!-- ==========================================
  DASHBOARD COMPONENT HTML
  Bố cục Dashboard chuẩn Accessibility & Responsive
========================================== -->
<div id="dashboard-view" class="dashboard-container">
    <section class="study-hero" aria-label="Không gian học tập">
        <div class="study-skyline" aria-hidden="true">
            <span class="study-cloud cloud-one"></span><span class="study-cloud cloud-two"></span>
            <span class="study-tree tree-left">🌳</span><span class="study-tree tree-right">🌳</span>
            <span class="study-bird bird-one">⌁</span><span class="study-bird bird-two">⌁</span>
            <span class="study-bus">🚌</span><span class="study-duck duck-one">🦆</span><span class="study-duck duck-two">🦆</span>
        </div>
        <div class="study-hero-copy"><span class="study-eyebrow">Góc học tập FE</span><h1>Hôm nay bạn muốn học gì?</h1><p>Mỗi câu hỏi là một bước tiến nhỏ.</p></div>
    </section>

    <!-- 3. STATISTICS CARDS -->
    <section aria-label="Thống kê tổng quan">
        <div class="stats-grid">
            <!-- Thống kê 1: Tổng bộ đề đã làm -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-total-exams" class="stat-value">0</span>
                    <span class="stat-label">Tổng số đề đã làm</span>
                </div>
            </div>

            <!-- Thống kê 2: Tổng số câu đã làm -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-total-questions" class="stat-value">0</span>
                    <span class="stat-label">Tổng số câu đã làm</span>
                </div>
            </div>

            <!-- Thống kê 3: Điểm trung bình -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-avg-score" class="stat-value">0.0</span>
                    <span class="stat-label">Điểm trung bình</span>
                </div>
            </div>

            <!-- Thống kê 4: Chuỗi ngày học (Streak) -->
            <div class="stat-card">
                <div class="stat-icon-wrapper">
                    <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <span id="stat-streak-days" class="stat-value">0 ngày</span>
                    <span class="stat-label">Streak liên tục</span>
                </div>
            </div>
        </div>
    </section>

</div>
