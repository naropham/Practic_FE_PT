<!-- ==========================================

========================================== -->

<!-- Backdrop che mờ màn hình khi mở trên Mobile -->

                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span class="nav-label">Trang chủ</span>
                </button>
            </li>

            <!-- 2. Môn học -->
            <li class="nav-item" role="none">
                <button type="button" class="nav-link" data-page="subjects" role="menuitem" aria-label="Danh sách Môn học">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    <span class="nav-label">Môn học</span>
                </button>
            </li>

            <!-- 6. Lịch sử làm bài -->
            <li class="nav-item" role="none">
                <button type="button" class="nav-link" data-page="history" role="menuitem" aria-label="Lịch sử làm bài thi">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="nav-label">Lịch sử làm bài</span>
                </button>
            </li>

            <!-- 7. Thống kê -->
            <li class="nav-item" role="none">
                <button type="button" class="nav-link" data-page="stats" role="menuitem" aria-label="Thống kê kết quả học tập">

</aside>
