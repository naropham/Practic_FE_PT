<!-- ==========================================
  HEADER COMPONENT HTML
  Được thiết kế độc lập, đầy đủ tiêu chuẩn Accessibility & Responsive
========================================== -->
<header class="app-header" aria-label="Thanh điều hướng chính">
    <!-- Khối bên trái: Nút Toggle Sidebar & Logo -->
    <div class="header-left">
        <button type="button" id="sidebar-toggle-btn" class="icon-btn" aria-label="Mở hoặc đóng menu ứng dụng" title="Mở/Đóng Sidebar">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <a href="#" id="header-logo" class="header-logo" title="Trở về trang chủ">
            <span>📝 Luyện Đề FE</span>
        </a>
    </div>

    <!-- Khối ở giữa: Thanh tìm kiếm -->
    <div class="header-center">
        <div class="search-box">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="search" id="header-search-input" class="search-input" placeholder="Tìm kiếm bộ đề, môn học... (Bấm '/' để tìm nhanh)" aria-label="Tìm kiếm bộ đề hoặc môn học">
            <kbd class="search-shortcut">Ctrl K</kbd>
        </div>
    </div>

    <!-- Khối bên phải: Nút thông báo, Nút Dark mode, Avatar -->
    <div class="header-right">
        <!-- Nút Thông báo -->
        <div class="nav-badge-container">
            <button type="button" id="notification-btn" class="icon-btn" aria-label="Xem thông báo mới" title="Thông báo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                </svg>
                <span class="badge" title="Có thông báo mới"></span>
            </button>
        </div>

        <!-- Nút chuyển Light / Dark mode -->
        <button type="button" id="theme-toggle-btn" class="icon-btn theme-toggle-btn" aria-label="Chuyển đổi giao diện Sáng / Tối" title="Đổi giao diện Sáng/Tối">
            <!-- Icon Mặt trời (Light Mode) -->
            <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <!-- Icon Mặt trăng (Dark Mode) -->
            <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>

        <!-- Avatar Người dùng -->
        <button type="button" id="user-avatar-btn" class="user-avatar-btn" aria-label="Tài khoản người dùng" title="Tài khoản">
            <img src="./assets/images/default-avatar.svg" alt="Avatar" class="user-avatar-img">
        </button>
    </div>
</header>
