<!-- ==========================================
  HEADER COMPONENT HTML
  Được thiết kế độc lập, đầy đủ tiêu chuẩn Accessibility & Responsive
========================================== -->
<header class="app-header" aria-label="Thanh điều hướng chính">
    <!-- Khối bên trái: Nút Toggle Sidebar & Logo -->
    <div class="header-left">
        <div class="header-menu-wrap">
        <button type="button" id="header-logo" class="header-logo" aria-haspopup="true" aria-expanded="false" title="Mở danh sách trang">
            <span>📝 Luyện Đề FE</span>
        </button>
        <nav id="header-page-menu" class="header-page-menu hidden" aria-label="Danh sách trang">
            <button type="button" data-header-page="home">🏠 <span>Trang chủ</span></button>
            <button type="button" data-header-page="subjects">📚 <span>Môn học</span></button>
            <button type="button" data-header-page="exams">📝 <span>Luyện đề</span></button>
            <button type="button" data-header-page="history">🕒 <span>Lịch sử làm bài</span></button>
            <button type="button" data-header-page="stats">📊 <span>Thống kê</span></button>
        </nav>
        </div>
    </div>

    <!-- Khối bên phải: Nút Dark mode, Avatar -->
    <div class="header-right">
        <!-- Nút chuyển Light / Dark mode -->
        <button type="button" id="theme-toggle-btn" class="icon-btn theme-toggle-btn" aria-label="Chuyển đổi giao diện Sáng / Tối" title="Đổi giao diện Sáng/Tối">
            <!-- Icon Mặt trời (Light Mode) -->
            <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <!-- Icon Mặt trăng (Dark Mode) -->
            <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
        </button>

        <!-- Avatar Người dùng -->
        <button type="button" id="user-avatar-btn" class="user-avatar-btn" aria-label="Tài khoản người dùng" title="Tài khoản">
            <img src="./assets/images/avatar.jpg" alt="Avatar" class="user-avatar-img">
        </button>
    </div>
</header>
